name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: agency
          POSTGRES_DB: agency_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agency -d agency_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agency:agency@localhost:5432/agency_test
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: uv sync --frozen --dev
        working-directory: backend
      - run: uv run --no-sync alembic upgrade head
        working-directory: backend
      - run: uv run --no-sync pytest -q
        working-directory: backend
      - run: uv run --no-sync ruff check .
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
