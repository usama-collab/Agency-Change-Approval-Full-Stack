services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
      POSTGRES_DB: agency
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
volumes:
  postgres_data:
